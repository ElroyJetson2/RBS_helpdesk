<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff – RBS Helpdesk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{colors:{navy:{DEFAULT:'#0B1E2D'},blue:{DEFAULT:'#00AEEF'},cream:'#F7F9FB'},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
  <style>body{font-family:Inter,system-ui,sans-serif}</style>
</head>
<body class="bg-cream min-h-screen text-navy">
  <div id="loginView" class="min-h-screen flex flex-col">
    <header class="bg-navy text-white py-4"><div class="max-w-sm mx-auto px-4 flex items-center gap-3">
      <a href="/" class="flex items-center gap-3 min-w-0 hover:opacity-90">
        <img src="https://static.wixstatic.com/media/01636e_59a9c7e5033445a6a91de7079e496a0e~mv2.png/v1/fill/w_388,h_86,al_c,q_85,usm_0.66_1.00_0.01,enc_png/RBS%20Logo%20White%20Horizontal.png" alt="Require Building Solutions" class="h-9 sm:h-10 w-auto max-w-[160px] object-contain" />
        <span class="text-white font-semibold tracking-[0.28em] text-xs sm:text-sm border-l border-white/30 pl-3 whitespace-nowrap">HELPDESK</span>
      </a>
    </div></header>
    <div class="flex-1 flex items-center justify-center px-4 py-12"><div class="bg-white rounded-2xl shadow-sm border border-navy/5 p-8 w-full max-w-sm">
      <h1 class="text-2xl text-navy text-center mb-6 font-semibold">Staff Login</h1>
      <form id="loginForm" class="space-y-4">
        <div><label class="block text-xs font-medium uppercase tracking-wider text-navy/50 mb-1.5">Username</label><input type="text" id="username" value="admin" required class="w-full border border-navy/15 rounded-lg px-3.5 py-3 bg-cream/50 outline-none" /></div>
        <div><label class="block text-xs font-medium uppercase tracking-wider text-navy/50 mb-1.5">Password</label><input type="password" id="password" required class="w-full border border-navy/15 rounded-lg px-3.5 py-3 bg-cream/50 outline-none" /></div>
        <div id="loginError" class="hidden text-red-700 text-sm"></div>
        <button type="submit" class="w-full bg-blue text-white py-3 rounded-lg font-medium hover:bg-blue/90">Sign in</button>
      </form>
      <p class="text-center text-xs text-navy/40 mt-5"><a href="/" class="text-blue hover:underline">← Back to report an incident</a></p>
    </div></div>
  </div>

  <div id="dashView" class="hidden">
    <header class="bg-navy text-white sticky top-0 z-10"><div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3 min-w-0 hover:opacity-90">
        <img src="https://static.wixstatic.com/media/01636e_59a9c7e5033445a6a91de7079e496a0e~mv2.png/v1/fill/w_388,h_86,al_c,q_85,usm_0.66_1.00_0.01,enc_png/RBS%20Logo%20White%20Horizontal.png" alt="Require Building Solutions" class="h-9 sm:h-10 w-auto max-w-[160px] object-contain" />
        <span class="text-white font-semibold tracking-[0.28em] text-xs sm:text-sm border-l border-white/30 pl-3 whitespace-nowrap">HELPDESK</span>
      </a>
      <div class="flex items-center gap-4 text-sm">
        <button onclick="showSection('incidents')" id="navIncidents" class="text-blue">Incidents</button>
        <button onclick="showSection('properties')" id="navProperties" class="text-white/70 hover:text-blue">Properties</button>
        <span id="userName" class="text-white/60"></span>
        <button onclick="logout()" class="text-white/70 hover:text-blue">Logout</button>
      </div>
    </div></header>

    <main id="sectionIncidents" class="max-w-5xl mx-auto px-4 py-6">
      <div class="flex flex-wrap gap-3 mb-6">
        <select id="filterDev" class="border border-navy/15 rounded-lg px-3 py-2 text-sm bg-white"><option value="">All properties</option></select>
        <select id="filterStatus" class="border border-navy/15 rounded-lg px-3 py-2 text-sm bg-white"><option value="">All statuses</option><option value="open">Open</option><option value="closed">Closed</option></select>
        <button onclick="loadIncidents()" class="bg-blue text-white px-4 py-2 rounded-lg text-sm hover:bg-blue/90">Refresh</button>
      </div>
      <div id="incidentList" class="space-y-3"></div>
      <p id="emptyMsg" class="hidden text-center text-navy/40 py-16 text-lg">No incidents found</p>
    </main>

    <main id="sectionProperties" class="hidden max-w-5xl mx-auto px-4 py-6">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl text-navy font-semibold">Manage Properties</h2>
        <button onclick="openPropertyModal()" class="bg-blue text-white px-4 py-2 rounded-lg text-sm hover:bg-blue/90">+ Add Property</button>
      </div>
      <div id="propertyList" class="space-y-3"></div>
      <p id="propEmpty" class="hidden text-center text-navy/40 py-16 text-lg">No properties yet. Add one with a verified address.</p>
    </main>
  </div>

  <div id="modal" class="hidden fixed inset-0 bg-navy/50 flex items-center justify-center p-4 z-20">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6">
      <h2 class="text-xl text-navy mb-1 font-semibold">Update Incident</h2>
      <p id="modalRef" class="font-mono text-sm text-navy/50 mb-5"></p>
      <form id="updateForm" class="space-y-4">
        <input type="hidden" id="updRef" />
        <div><label class="block text-xs font-medium uppercase tracking-wider text-navy/50 mb-1.5">Status</label>
          <select id="updStatus" class="w-full border border-navy/15 rounded-lg px-3 py-2.5 bg-cream/50"><option value="open">Open</option><option value="closed">Closed</option></select></div>
        <div><label class="block text-xs font-medium uppercase tracking-wider text-navy/50 mb-1.5">Note / Update for customer</label>
          <textarea id="updNote" rows="3" placeholder="What happened / next steps…" class="w-full border border-navy/15 rounded-lg px-3 py-2.5 bg-cream/50 resize-none"></textarea></div>
        <div id="updError" class="hidden text-red-700 text-sm"></div>
        <div class="flex gap-3 pt-1"><button type="button" onclick="closeModal()" class="flex-1 border border-navy/15 py-2.5 rounded-lg">Cancel</button>
          <button type="submit" class="flex-1 bg-blue text-white py-2.5 rounded-lg font-medium hover:bg-blue/90">Save Update</button></div>
      </form>
    </div>
  </div>

  <div id="propModal" class="hidden fixed inset-0 bg-navy/50 flex items-center justify-center p-4 z-20">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6">
      <h2 class="text-xl text-navy mb-1 font-semibold" id="propModalTitle">Add Property</h2>
      <p class="text-sm text-navy/50 mb-5">Address must be selected from Google suggestions</p>
      <form id="propForm" class="space-y-4">
        <input type="hidden" id="propId" />
        <div>
          <label class="block text-xs font-medium uppercase tracking-wider text-navy/50 mb-1.5">Property Name *</label>
          <input type="text" id="propName" required placeholder="e.g. Riverside Apartments" class="w-full border border-navy/15 rounded-lg px-3 py-2.5 bg-cream/50 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-medium uppercase tracking-wider text-navy/50 mb-1.5">Short Code (optional)</label>
          <input type="text" id="propCode" placeholder="e.g. RA" maxlength="10" class="w-full border border-navy/15 rounded-lg px-3 py-2.5 bg-cream/50 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-medium uppercase tracking-wider text-navy/50 mb-1.5">Address * (start typing)</label>
          <input type="text" id="propAddress" required placeholder="Start typing an Australian address…" class="w-full border border-navy/15 rounded-lg px-3 py-2.5 bg-cream/50 outline-none" autocomplete="off" />
          <p id="propAddressStatus" class="text-xs mt-1 text-navy/40">Select a suggestion to verify the address</p>
          <input type="hidden" id="propPlaceId" />
          <input type="hidden" id="propFormatted" />
          <input type="hidden" id="propLat" />
          <input type="hidden" id="propLng" />
        </div>
        <div id="propError" class="hidden text-red-700 text-sm"></div>
        <div class="flex gap-3 pt-1">
          <button type="button" onclick="closePropModal()" class="flex-1 border border-navy/15 py-2.5 rounded-lg">Cancel</button>
          <button type="submit" id="propSaveBtn" class="flex-1 bg-blue text-white py-2.5 rounded-lg font-medium hover:bg-blue/90">Save Property</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/admin.js"></script>
  <script>
    // Fallback: if external script missing, show message
    if (typeof showDash === 'undefined') {
      document.addEventListener('DOMContentLoaded', function() {
        var s = document.createElement('script');
        s.textContent = document.getElementById('admin-inline') ? document.getElementById('admin-inline').textContent : '';
      });
    }
  </script>
  <script id="admin-inline">
    let token = localStorage.getItem('rbs_token') || '';
    let displayName = localStorage.getItem('rbs_name') || '';
    let placesAutocomplete = null;
    let googleReady = false;
    let mapsKeyLoaded = false;
    function formatDate(iso){ if(!iso)return '—'; const d=new Date(iso.includes('T')?iso:iso+'Z'); return d.toLocaleString('en-AU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
    async function loadGoogleMaps() { if (mapsKeyLoaded || !token) return; try { const res = await fetch('/api/admin/maps-key', { headers: { Authorization: 'Bearer ' + token } }); if (!res.ok) return; const data = await res.json(); if (!data.key) return; await new Promise((resolve, reject) => { const script = document.createElement('script'); script.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(data.key) + '&libraries=places'; script.async = true; script.onload = () => { googleReady = true; mapsKeyLoaded = true; resolve(); }; script.onerror = reject; document.head.appendChild(script); }); } catch (e) { console.warn('Could not load Google Maps', e); } }
    if (token) { showDash(); loadGoogleMaps(); }
    document.getElementById('loginForm').addEventListener('submit', async (e) => { e.preventDefault(); const err = document.getElementById('loginError'); err.classList.add('hidden'); try { const res = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value }) }); const data = await res.json(); if (!res.ok) throw new Error(data.error || 'Login failed'); token = data.token; displayName = data.display_name; localStorage.setItem('rbs_token', token); localStorage.setItem('rbs_name', displayName); showDash(); loadGoogleMaps(); } catch (ex) { err.textContent = ex.message; err.classList.remove('hidden'); } });
    function logout() { token = ''; localStorage.removeItem('rbs_token'); localStorage.removeItem('rbs_name'); document.getElementById('loginView').classList.remove('hidden'); document.getElementById('dashView').classList.add('hidden'); }
    function showDash() { document.getElementById('loginView').classList.add('hidden'); document.getElementById('dashView').classList.remove('hidden'); document.getElementById('userName').textContent = displayName; showSection('incidents'); }
    function showSection(name) { document.getElementById('sectionIncidents').classList.toggle('hidden', name !== 'incidents'); document.getElementById('sectionProperties').classList.toggle('hidden', name !== 'properties'); document.getElementById('navIncidents').className = name === 'incidents' ? 'text-blue' : 'text-white/70 hover:text-blue'; document.getElementById('navProperties').className = name === 'properties' ? 'text-blue' : 'text-white/70 hover:text-blue'; if (name === 'incidents') loadIncidents(); if (name === 'properties') loadProperties(); }
    async function loadIncidents() { const list = document.getElementById('incidentList'); const empty = document.getElementById('emptyMsg'); list.innerHTML = '<p class="text-navy/40 text-center py-10">Loading…</p>'; const params = new URLSearchParams(); const dev = document.getElementById('filterDev').value; const status = document.getElementById('filterStatus').value; if (dev) params.set('development_id', dev); if (status) params.set('status', status); try { const res = await fetch('/api/admin/incidents?' + params, { headers: { Authorization: 'Bearer ' + token } }); if (res.status === 401) { logout(); return; } const data = await res.json(); if (!res.ok) throw new Error(data.error); const sel = document.getElementById('filterDev'); if (sel.options.length <= 1 && data.developments) { data.developments.forEach(d => { const o = document.createElement('option'); o.value = d.id; o.textContent = d.name; sel.appendChild(o); }); } list.innerHTML = ''; if (!data.incidents.length) { empty.classList.remove('hidden'); return; } empty.classList.add('hidden'); data.incidents.forEach(i => { const open = i.status === 'open'; const card = document.createElement('div'); card.className = 'bg-white rounded-xl border border-navy/5 p-4 hover:shadow-sm transition'; const note = i.latest_note ? '<p class="text-sm text-navy/70 mt-2 bg-cream/80 rounded-lg px-3 py-2 border border-navy/5"><span class="text-[10px] uppercase tracking-wider text-navy/40 block mb-0.5">Latest update</span>' + i.latest_note + '</p>' : ''; card.innerHTML = '<div class="flex items-start justify-between gap-3"><div><p class="ref font-mono font-semibold text-navy"></p><p class="loc text-sm text-navy/50"></p></div><span class="status-badge px-2.5 py-0.5 rounded-full text-xs font-medium ' + (open ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800') + '">' + (open ? 'Open' : 'Closed') + '</span></div><p class="desc text-sm text-navy/80 mt-2 line-clamp-2"></p>' + note + '<div class="flex items-center justify-between mt-3 text-xs text-navy/40"><span class="meta"></span><button class="upd-btn text-blue hover:underline font-medium">Update</button></div>'; card.querySelector('.ref').textContent = i.reference; card.querySelector('.loc').textContent = i.development_name + (i.unit ? ' · ' + i.unit : ''); card.querySelector('.desc').textContent = i.description; card.querySelector('.meta').textContent = formatDate(i.created_at); card.querySelector('.upd-btn').addEventListener('click', () => openModal(i)); list.appendChild(card); }); } catch (err) { list.innerHTML = '<p class="text-red-600 text-center py-10">' + err.message + '</p>'; } }
    function openModal(i) { document.getElementById('updRef').value = i.reference; document.getElementById('modalRef').textContent = i.reference + ' · ' + i.development_name; document.getElementById('updStatus').value = i.status === 'closed' ? 'closed' : 'open'; document.getElementById('updNote').value = ''; document.getElementById('updError').classList.add('hidden'); document.getElementById('modal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('modal').classList.add('hidden'); }
    document.getElementById('updateForm').addEventListener('submit', async (e) => { e.preventDefault(); const errEl = document.getElementById('updError'); errEl.classList.add('hidden'); try { const res = await fetch('/api/admin/update', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify({ reference: document.getElementById('updRef').value, status: document.getElementById('updStatus').value, note: document.getElementById('updNote').value.trim() }) }); const data = await res.json(); if (!res.ok) throw new Error(data.error || 'Update failed'); closeModal(); loadIncidents(); } catch (ex) { errEl.textContent = ex.message; errEl.classList.remove('hidden'); } });
    document.getElementById('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
    async function loadProperties() { const list = document.getElementById('propertyList'); const empty = document.getElementById('propEmpty'); list.innerHTML = '<p class="text-navy/40 text-center py-10">Loading…</p>'; try { const res = await fetch('/api/admin/properties', { headers: { Authorization: 'Bearer ' + token } }); if (res.status === 401) { logout(); return; } const data = await res.json(); if (!res.ok) throw new Error(data.error); list.innerHTML = ''; if (!data.properties || !data.properties.length) { empty.classList.remove('hidden'); return; } empty.classList.add('hidden'); data.properties.forEach(p => { const card = document.createElement('div'); card.className = 'bg-white rounded-xl border border-navy/5 p-4 flex items-start justify-between gap-4'; card.innerHTML = '<div class="min-w-0"><p class="font-medium text-navy">' + escapeHtml(p.name) + (p.code ? ' <span class="text-navy/40 text-sm">(' + escapeHtml(p.code) + ')</span>' : '') + '</p><p class="text-sm text-navy/60 mt-0.5 truncate">' + escapeHtml(p.formatted_address || p.address || '—') + '</p>' + (p.place_id ? '<p class="text-[10px] text-emerald-700 mt-1">✓ Verified address</p>' : '<p class="text-[10px] text-amber-700 mt-1">No verified place_id</p>') + '</div><div class="flex gap-2 shrink-0"><button class="edit-btn text-sm text-blue hover:underline">Edit</button><button class="del-btn text-sm text-red-600 hover:underline">Delete</button></div>'; card.querySelector('.edit-btn').addEventListener('click', () => openPropertyModal(p)); card.querySelector('.del-btn').addEventListener('click', () => deleteProperty(p)); list.appendChild(card); }); } catch (err) { list.innerHTML = '<p class="text-red-600 text-center py-10">' + err.message + '</p>'; } }
    function escapeHtml(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function openPropertyModal(p) { document.getElementById('propModalTitle').textContent = p ? 'Edit Property' : 'Add Property'; document.getElementById('propId').value = p ? p.id : ''; document.getElementById('propName').value = p ? p.name : ''; document.getElementById('propCode').value = p ? (p.code || '') : ''; document.getElementById('propAddress').value = p ? (p.formatted_address || p.address || '') : ''; document.getElementById('propPlaceId').value = p ? (p.place_id || '') : ''; document.getElementById('propFormatted').value = p ? (p.formatted_address || '') : ''; document.getElementById('propLat').value = p && p.lat != null ? p.lat : ''; document.getElementById('propLng').value = p && p.lng != null ? p.lng : ''; document.getElementById('propError').classList.add('hidden'); document.getElementById('propModal').classList.remove('hidden'); setTimeout(initPlaces, 100); }
    function closePropModal() { document.getElementById('propModal').classList.add('hidden'); }
    document.getElementById('propModal').addEventListener('click', (e) => { if (e.target.id === 'propModal') closePropModal(); });
    function initPlaces() { if (!googleReady || !window.google || !google.maps || !google.maps.places) return; const input = document.getElementById('propAddress'); if (placesAutocomplete) return; placesAutocomplete = new google.maps.places.Autocomplete(input, { types: ['address'], componentRestrictions: { country: 'au' } }); placesAutocomplete.addListener('place_changed', () => { const place = placesAutocomplete.getPlace(); if (!place.geometry) return; document.getElementById('propPlaceId').value = place.place_id || ''; document.getElementById('propFormatted').value = place.formatted_address || input.value; document.getElementById('propLat').value = place.geometry.location.lat(); document.getElementById('propLng').value = place.geometry.location.lng(); document.getElementById('propAddressStatus').textContent = 'Verified address selected'; document.getElementById('propAddressStatus').className = 'text-xs mt-1 text-emerald-700'; }); }
    document.getElementById('propForm').addEventListener('submit', async (e) => { e.preventDefault(); const errEl = document.getElementById('propError'); errEl.classList.add('hidden'); const id = document.getElementById('propId').value; const body = { name: document.getElementById('propName').value.trim(), code: document.getElementById('propCode').value.trim(), address: document.getElementById('propAddress').value.trim(), place_id: document.getElementById('propPlaceId').value, formatted_address: document.getElementById('propFormatted').value, lat: document.getElementById('propLat').value, lng: document.getElementById('propLng').value }; try { const res = await fetch('/api/admin/properties' + (id ? '/' + id : ''), { method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify(body) }); const data = await res.json(); if (!res.ok) throw new Error(data.error || 'Save failed'); closePropModal(); loadProperties(); } catch (ex) { errEl.textContent = ex.message; errEl.classList.remove('hidden'); } });
    async function deleteProperty(p) { if (!confirm('Delete property ' + p.name + '?')) return; try { const res = await fetch('/api/admin/properties/' + p.id, { method: 'DELETE', headers: { Authorization: 'Bearer ' + token } }); if (res.status === 401) { logout(); return; } const data = await res.json(); if (!res.ok) throw new Error(data.error || 'Delete failed'); loadProperties(); } catch (ex) { alert(ex.message); } }
  </script>
</body>
</html>
